name: Deploy

on:
  push:
    branches:
      - develop
      - main

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend to Render (prod)
        if: github.ref == 'refs/heads/main'
        run: curl -s "$HOOK"
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND_PROD }}

      - name: Deploy backend to Render (staging)
        if: github.ref != 'refs/heads/main'
        run: curl -s "$HOOK"
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND_STAGING }}

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Vercel deploys automatically on push
        run: echo "Frontend déployé par Vercel via GitHub integration"
